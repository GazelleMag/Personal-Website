<div #sceneContainer class="scene-container">
	<div
		*ngIf="showIntroOverlay"
		class="intro-screen-overlay"
		[class.clearing]="isIntroOverlayClearing"
		(transitionend)="onIntroOverlayTransitionEnd()"
		aria-hidden="true"
	></div>

	<section
		*ngIf="showIntroButton"
		class="intro-copy"
		aria-live="polite"
	>
		<p class="intro-title">{{ introTitle }}</p>
		<p class="intro-subtitle">{{ introSubtitle }}</p>
		<div class="intro-controls-tip" aria-label="Use WASD keys to move">
			<p class="controls-tip-line">
				<span>Use</span>
				<span class="wasd-inline" aria-hidden="true">
					<span class="keycap">W</span>
					<span class="keycap">A</span>
					<span class="keycap">S</span>
					<span class="keycap">D</span>
				</span>
				<span>to move.</span>
			</p>
		</div>

		<button
			type="button"
			class="intro-floating-button"
			(click)="startExperience()"
		>
			Begin
		</button>
	</section>

	<div
		*ngIf="shouldShowTouchJoystick"
		#touchJoystick
		class="touch-joystick"
		[style.--joystick-bottom-offset.px]="joystickViewportBottomOffset"
		[class.is-active]="joystickKnobOffsetX !== 0 || joystickKnobOffsetY !== 0"
		(pointerdown)="onJoystickPointerDown($event)"
		(pointermove)="onJoystickPointerMove($event)"
		(pointerup)="onJoystickPointerUp($event)"
		(pointercancel)="onJoystickPointerUp($event)"
	>
		<div class="touch-joystick-base"></div>
		<div
			class="touch-joystick-knob"
			[style.transform]="'translate(' + joystickKnobOffsetX + 'px, ' + joystickKnobOffsetY + 'px)'"
		></div>
	</div>

	<article
		*ngIf="activePanelSection"
		class="info-panel"
		[class.info-panel-compact]="activePanelSection.id === 'cv'"
		[class.info-panel-portfolio]="activePanelSection.id === 'portfolio'"
		[style.left.px]="infoPanelScreenX"
		[style.top.px]="infoPanelScreenY"
		[style.opacity]="infoPanelOpacity"
		[style.--accent]="activePanelSection.accentColor"
	>
		<header class="panel-header">
			<h2>{{ activePanelSection.title }}</h2>
			<p *ngIf="activePanelSection.subtitle">{{ activePanelSection.subtitle }}</p>
		</header>

		<section class="panel-highlights" *ngIf="activePanelSection.highlights?.length">
			<p class="highlight-line" *ngFor="let line of activePanelSection.highlights">{{ line }}</p>
		</section>

		<section class="panel-links" *ngIf="activePanelSection.contactLinks?.length">
			<a
				class="icon-link"
				[ngClass]="'contact-link-' + link.icon"
				*ngFor="let link of activePanelSection.contactLinks"
				[href]="link.href"
				[attr.aria-label]="link.label"
				[title]="link.label"
				target="_blank"
				rel="noopener noreferrer"
			>
				<span class="skill-icon-pill contact-icon-pill" [ngClass]="'contact-icon-' + link.icon" aria-hidden="true" [ngSwitch]="link.icon">
					<svg *ngSwitchCase="'email'" viewBox="0 0 24 24" focusable="false">
						<path d="M3.5 6.75A1.75 1.75 0 0 1 5.25 5h13.5a1.75 1.75 0 0 1 1.75 1.75v10.5A1.75 1.75 0 0 1 18.75 19H5.25a1.75 1.75 0 0 1-1.75-1.75V6.75zm1.98.2L12 11.2l6.52-4.25a.24.24 0 0 0-.02-.08.25.25 0 0 0-.22-.12H5.25a.25.25 0 0 0-.22.12.24.24 0 0 0-.02.08zm13.02 1.93-5.95 3.87a1 1 0 0 1-1.1 0L5.5 8.88v8.37c0 .14.11.25.25.25h12.5a.25.25 0 0 0 .25-.25V8.88z" />
					</svg>
					<svg *ngSwitchCase="'github'" viewBox="0 0 24 24" focusable="false">
						<path d="M12 .6C5.7.6.6 5.7.6 12c0 5 3.2 9.2 7.6 10.7.6.1.8-.3.8-.6v-2.2c-3.1.7-3.8-1.3-3.8-1.3-.5-1.3-1.2-1.7-1.2-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 1.7 2.7 1.2 3.4.9.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.2-5.1-5.5 0-1.2.4-2.2 1.2-3-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.1 11.1 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3 0 4.3-2.6 5.2-5.1 5.5.4.3.8 1 .8 2.1v3.1c0 .3.2.7.8.6 4.4-1.5 7.6-5.7 7.6-10.7C23.4 5.7 18.3.6 12 .6z" />
					</svg>
					<svg *ngSwitchCase="'linkedin'" viewBox="0 0 24 24" focusable="false">
						<path d="M20.45 20.45h-3.56v-5.58c0-1.33-.03-3.03-1.85-3.03-1.85 0-2.13 1.44-2.13 2.93v5.68H9.35V9h3.42v1.56h.05c.47-.9 1.64-1.85 3.37-1.85 3.6 0 4.26 2.37 4.26 5.46v6.28zM5.34 7.44a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM7.12 20.45H3.56V9h3.56v11.45z" />
					</svg>
				</span>
			</a>
		</section>

		<section class="panel-actions" *ngIf="activePanelSection.actions?.length">
			<a
				class="action-button"
				*ngFor="let action of activePanelSection.actions"
				[href]="action.href"
				[attr.download]="action.download ? '' : null"
				target="_blank"
				rel="noopener noreferrer"
			>
				{{ action.label }}
			</a>
		</section>

		<section class="project-groups" *ngIf="activePanelSection.projectGroups?.length">
			<article class="project-group" *ngFor="let group of activePanelSection.projectGroups">
				<h3>{{ group.name }}</h3>
				<div class="project-thumbnails">
					<a
						class="project-thumb-link"
						*ngFor="let project of group.projects"
						[href]="project.href"
						target="_blank"
						rel="noopener noreferrer"
						[attr.aria-label]="project.title"
						[title]="project.title"
					>
						<span class="project-thumb-image" [class.has-thumb]="!!project.thumbnailUrl" aria-hidden="true">
							<img
								*ngIf="project.thumbnailUrl"
								class="project-thumb-photo"
								[src]="project.thumbnailUrl"
								[alt]="project.title + ' screenshot'"
								loading="lazy"
								decoding="async"
							/>
						</span>
					</a>
				</div>
			</article>
		</section>

		<section class="skill-groups" *ngIf="activePanelSection.skillGroups?.length">
			<article class="skill-group" *ngFor="let group of activePanelSection.skillGroups">
				<h3>{{ group.name }}</h3>
				<div class="skills-grid">
					<div class="skill-chip" *ngFor="let skill of group.items">
						<span class="skill-icon-pill" [ngClass]="'skill-icon-' + skill.icon" aria-hidden="true" [ngSwitch]="skill.icon">
							<img *ngIf="skill.logo" class="skill-logo" [src]="skill.logo" [alt]="skill.name + ' logo'" loading="lazy" decoding="async" (error)="skill.logo = undefined" />
							<ng-container *ngIf="!skill.logo">
							<svg *ngSwitchCase="'typescript'" viewBox="0 0 24 24" focusable="false"><path d="M2.5 2.5h19v19h-19z"/><path d="M6.8 7.7h10.4v2h-4.1v8h-2.2v-8H6.8zM18.2 10.4c-.4-.5-1-.8-1.8-.8-.7 0-1.2.3-1.2.8 0 .6.7.8 1.8 1.1 1.7.4 3.2.9 3.2 2.8 0 2-1.6 3.1-3.8 3.1-1.7 0-3-.5-4-1.7l1.6-1.4c.6.7 1.4 1.1 2.4 1.1.8 0 1.4-.3 1.4-.9s-.6-.8-2-.2c-1.9-.5-3-1.1-3-2.8 0-1.9 1.5-3 3.6-3 1.5 0 2.6.4 3.4 1.3z"/></svg>
							<svg *ngSwitchCase="'javascript'" viewBox="0 0 24 24" focusable="false"><path d="M2.5 2.5h19v19h-19z"/><path d="M13.3 15.9c.4.6.9 1 1.8 1 .8 0 1.3-.4 1.3-1 0-.7-.6-1-1.5-1.4l-.5-.2c-1.4-.6-2.4-1.4-2.4-3.1 0-1.5 1.2-2.7 3-2.7 1.3 0 2.2.4 2.9 1.7l-1.6 1c-.3-.6-.7-.8-1.2-.8-.6 0-.9.3-.9.8 0 .6.3.8 1.2 1.1l.5.2c1.7.7 2.7 1.5 2.7 3.3 0 1.9-1.5 2.9-3.5 2.9-2 0-3.2-1-3.9-2.2zM6.2 16c.3.5.6.9 1.2.9.6 0 1-.2 1-1.2V8.6h2.2v7.1c0 2.2-1.3 3.2-3.2 3.2-1.8 0-2.8-.9-3.3-2z"/></svg>
							<svg *ngSwitchCase="'dotnet'" viewBox="0 0 24 24" focusable="false"><rect x="2.5" y="2.5" width="19" height="19" rx="4" ry="4"/><path d="M6.1 16.5v-9h2.4c2.7 0 4.2 1.5 4.2 4.5 0 3-1.5 4.5-4.2 4.5zm2.2-1.9h.3c1.4 0 2-1 2-2.6s-.6-2.6-2-2.6h-.3zM14 16.5v-9h2.1v3.3c.4-.4 1-.7 1.7-.7 1.5 0 2.6 1.2 2.6 3.2v3.2h-2.1v-3c0-1-.4-1.5-1.1-1.5-.7 0-1.1.5-1.1 1.5v3z"/></svg>
							<svg *ngSwitchCase="'sql'" viewBox="0 0 24 24" focusable="false"><path d="M12 3.5c-4.7 0-8.5 1.5-8.5 3.4v10.2c0 1.9 3.8 3.4 8.5 3.4s8.5-1.5 8.5-3.4V6.9c0-1.9-3.8-3.4-8.5-3.4zm0 1.6c4 0 6.9 1.1 6.9 1.8S16 8.7 12 8.7 5.1 7.6 5.1 6.9 8 5.1 12 5.1zm0 5.8c2.9 0 5.4-.4 6.9-1V12c0 .7-2.9 1.8-6.9 1.8S5.1 12.7 5.1 12v-2.1c1.5.6 4 1 6.9 1zm0 5.9c-4 0-6.9-1.1-6.9-1.8V14c1.5.6 4 1 6.9 1s5.4-.4 6.9-1v1.1c0 .7-2.9 1.8-6.9 1.8z"/></svg>
							<svg *ngSwitchCase="'angular'" viewBox="0 0 24 24" focusable="false"><path d="M12 2.3l8.2 2.9-1.2 10.8L12 21.7 5 16 3.8 5.2z"/><path d="M12 4.8L7 16h1.9l1-2.4h4.3l1 2.4H17zM10.6 11.8L12 8.5l1.4 3.3z"/></svg>
							<svg *ngSwitchCase="'bootstrap'" viewBox="0 0 24 24" focusable="false"><rect x="3" y="4" width="18" height="16" rx="3" ry="3"/><path d="M8 7.3h5c2 0 3.1 1 3.1 2.6 0 1.1-.6 1.9-1.6 2.2 1.3.2 2.1 1.1 2.1 2.5 0 1.8-1.4 3-3.6 3H8zm2.2 3.8h2.4c.8 0 1.3-.4 1.3-1.1 0-.7-.5-1.1-1.3-1.1h-2.4zm0 4.1h2.7c1 0 1.5-.5 1.5-1.3s-.6-1.3-1.5-1.3h-2.7z"/></svg>
							<svg *ngSwitchCase="'jasmine'" viewBox="0 0 24 24" focusable="false"><path d="M12 3.2c2.1 2 4.2 3.5 4.2 6.2 0 2.3-1.8 4-4.2 4s-4.2-1.7-4.2-4c0-2.7 2.1-4.2 4.2-6.2z"/><path d="M12 14.5c3.6 0 6.5 2 6.5 4.5H5.5c0-2.5 2.9-4.5 6.5-4.5z"/></svg>
							<svg *ngSwitchCase="'html'" viewBox="0 0 24 24" focusable="false"><path d="M4 3h16l-1.5 16.8L12 22l-6.5-2.2z"/><path d="M8 6.5h8l-.2 2.1H10l.2 2.4h5.4l-.6 6-3 1-3-.9-.2-2.2h2.1l.1.8 1 .3 1.1-.4.2-2.1H8.3z"/></svg>
							<svg *ngSwitchCase="'css'" viewBox="0 0 24 24" focusable="false"><path d="M4 3h16l-1.5 16.8L12 22l-6.5-2.2z"/><path d="M8 6.5h8l-.2 2.1H10l.1 2h5.5l-.5 6-3.1 1-3-.9-.1-2.2h2.1l.1.8 1 .3 1.1-.4.2-2.1H8.2z"/></svg>
							<svg *ngSwitchCase="'cypress'" viewBox="0 0 24 24" focusable="false"><path d="M4.2 12c0-4.4 3.4-7.7 7.8-7.7 2.3 0 4.2.8 5.7 2.4l-1.6 1.5c-1-1-2.4-1.6-4.1-1.6-3.1 0-5.5 2.3-5.5 5.5s2.4 5.5 5.5 5.5c1.7 0 3.1-.6 4.1-1.6l1.6 1.5c-1.4 1.6-3.4 2.4-5.7 2.4-4.4 0-7.8-3.3-7.8-7.9z"/><path d="M13.3 9.1h6.5v2.1h-6.5zM13.3 12.8h5.2V15h-5.2z"/></svg>
							<svg *ngSwitchCase="'unity'" viewBox="0 0 24 24" focusable="false"><path d="M12 3.2l3.2 1.8v3.6L12 10.4 8.8 8.6V5z"/><path d="M6.5 8.4l3.1 1.8v3.6l-3.1 1.8-3.1-1.8v-3.6z"/><path d="M17.5 8.4l3.1 1.8v3.6l-3.1 1.8-3.1-1.8v-3.6z"/><path d="M12 13.6l3.2 1.8V19L12 20.8 8.8 19v-3.6z"/></svg>
							<svg *ngSwitchCase="'godot'" viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="11.5" r="6.8"/><circle cx="9.2" cy="10.3" r="1.1"/><circle cx="14.8" cy="10.3" r="1.1"/><path d="M9 14.2c.7.6 1.7 1 3 1s2.3-.4 3-1"/><path d="M6.8 6.1L8.9 3.9M17.2 6.1l-2.1-2.2"/></svg>
							<svg *ngSwitchCase="'aseprite'" viewBox="0 0 24 24" focusable="false"><path d="M6 4h12v12H6z"/><path d="M8 6h2v2H8zM11 6h2v2h-2zM14 6h2v2h-2zM8 9h2v2H8zM11 9h2v2h-2zM14 9h2v2h-2zM8 12h2v2H8zM11 12h2v2h-2zM14 12h2v2h-2z"/><path d="M9 18h6"/></svg>
							<svg *ngSwitchCase="'audacity'" viewBox="0 0 24 24" focusable="false"><path d="M7.4 7.2v9.6M16.6 7.2v9.6"/><path d="M9.8 6.1v11.8M14.2 6.1v11.8"/><path d="M12 4.7v14.6"/><path d="M4.8 12h2M17.2 12h2"/></svg>
							</ng-container>
						</span>
						<span>{{ skill.name }}</span>
					</div>
				</div>
			</article>
		</section>

	</article>
</div>
